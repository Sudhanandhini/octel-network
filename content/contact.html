<section class="container ptb-120">
  <div class="row g-4 mb-5">
    <div class="col-lg-4 col-md-6">
      <div class="contact-info-card round-20 h-100" data-cue="slideInUp">
        <div class="icon"><i class="ri-phone-fill"></i></div>
        <h5 class="fs-20 mb-2">Call Us</h5>
        <p class="mb-0"><a href="tel:18083609282" class="text-para">+1 (808) 360-9282</a><br />Mon–Fri, 9am–6pm EST</p>
      </div>
    </div>
    <div class="col-lg-4 col-md-6">
      <div class="contact-info-card round-20 h-100" data-cue="slideInUp" data-delay="100">
        <div class="icon"><i class="ri-mail-fill"></i></div>
        <h5 class="fs-20 mb-2">Email Us</h5>
        <p class="mb-0"><a href="mailto:hello@exrox.com" class="text-para">hello@exrox.com</a><br />We reply within one business day</p>
      </div>
    </div>
    <div class="col-lg-4 col-md-6">
      <div class="contact-info-card round-20 h-100" data-cue="slideInUp" data-delay="200">
        <div class="icon"><i class="ri-map-pin-fill"></i></div>
        <h5 class="fs-20 mb-2">Visit Us</h5>
        <p class="mb-0">200 W Madison St<br />Chicago, IL 60606</p>
      </div>
    </div>
  </div>

  <div class="row g-5 align-items-start">
    <div class="col-lg-7">
      <div class="contact-form-box round-20">
        <h3 class="mb-3">Send Us A Message</h3>
        <p class="mb-30">Tell us a bit about your business and we'll follow up within one business day.</p>
        <form action="#" onsubmit="return false;">
          <div class="row g-3">
            <div class="col-md-6">
              <input type="text" class="form-control round-5" placeholder="Your Name" required />
            </div>
            <div class="col-md-6">
              <input type="email" class="form-control round-5" placeholder="Your Email" required />
            </div>
            <div class="col-md-6">
              <input type="tel" class="form-control round-5" placeholder="Phone Number" />
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control round-5" placeholder="Subject" />
            </div>
            <div class="col-12">
              <textarea class="form-control round-5" placeholder="Tell us about your business..." required></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn style-one">
                <span class="btn-icon-one"><i class="ri-arrow-right-up-line"></i></span>
                <span class="btn-text">Send Message</span>
                <span class="btn-icon-two"><i class="ri-arrow-right-up-line"></i></span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="map-wrap round-20 overflow-hidden">
        <iframe
          title="Exrox office location"
          src="https://www.openstreetmap.org/export/embed.html?bbox=-87.6428%2C41.8788%2C-87.6228%2C41.8888&layer=mapnik"
          loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </div>
</section>
